name: Build sdist and Wheels
on:
  push:
    branches: [main]
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build_wheels:
    strategy:
      matrix:
        include:
        - os: ubuntu-24.04
        - os: ubuntu-24.04-arm
        - os: windows-latest
        - os: windows-11-arm
        - os: macos-15-intel
        - os: macos-latest
        - os: ubuntu-24.04
          cibw_archs: riscv64
          name_suffix: "-riscv64"
        - os: ubuntu-24.04-arm
          cibw_platform: pyodide
          name_suffix: "-pyodide"

    runs-on: ${{ matrix.os }}
    name: Build wheels on ${{ matrix.os }}${{ matrix.name_suffix || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: "pip"
      - name: Cythonize
        shell: bash
        run: |
          pip install -r requirements.txt
          make cython

      - name: Set up QEMU for emulation
        if: matrix.cibw_archs == 'riscv64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.cibw_archs }}

      - name: Build
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {package}/test"
          CIBW_SKIP: "cp38-* cp39-* cp310-win_arm64"
          CIBW_ARCHS: ${{ matrix.cibw_archs || 'auto' }}
          CIBW_PLATFORM: ${{ matrix.cibw_platform || 'auto' }}

      - name: Build sdist
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          pip install build
          python -m build -s -o wheelhouse

      - name: Upload Wheels to artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}${{ matrix.name_suffix || '' }}
          path: wheelhouse

  # combine all wheels into one artifact
  combine_wheels:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Upload Wheels to artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-all
          path: dist

  # https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml
  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        #with:
        # To test: repository-url: https://test.pypi.org/legacy/
